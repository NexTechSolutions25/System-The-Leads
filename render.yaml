# Somente a API gratuita existente. Nao cria Redis nem worker separado.
services:
  - type: web
    name: System-The-Leads
    runtime: node
    region: virginia
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: FREE_MODE
        value: "true"
